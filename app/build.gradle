plugins {
    id 'com.android.application'
}

// The team supplies this file from Firebase Console. Without it, guest mode remains usable.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('Firebase configuration missing: add app/google-services.json to enable email authentication.')
}

// The AirLabs key is read from local.properties so it never ends up in git.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def airLabsKey = localProps.getProperty('AIRLABS_API_KEY', '')

android {
    namespace = 'vn.edu.usth.flightinfo'
    compileSdk = 37

    defaultConfig {
        applicationId = 'vn.edu.usth.flightinfo'
        minSdk = 24
        // 34 keeps the classic (non edge-to-edge) window behaviour taught in the course.
        targetSdk = 34
        versionCode = 1
        versionName = '1.0'

        buildConfigField 'String', 'AIRLABS_API_KEY', "\"${airLabsKey}\""
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    androidResources {
        // Generates the per-app language list (Settings > Language) from values-* folders.
        generateLocaleConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // Real backdrop blur for the glass navigation bar and map sheet (RenderEffect on Android 12+).
    implementation 'com.github.Dimezis:BlurView:version-3.2.0'

    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    // android.jar only ships stubs of org.json, so JVM unit tests need the real implementation.
    testImplementation 'org.json:json:20240303'
}
