pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Only BlurView is fetched from JitPack.
        maven {
            url = 'https://jitpack.io'
            content { includeGroup 'com.github.Dimezis' }
        }
    }
}

rootProject.name = "FlightInfo"
include ':app'
